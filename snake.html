<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .score, .high-score {
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 10px;
            font-weight: bold;
        }

        .score span, .high-score span {
            color: #667eea;
        }

        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            background: #000;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .instructions p {
            color: #666;
            margin-bottom: 5px;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }

        .game-over-content h2 {
            color: #d9534f;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .game-over-content p {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇游戏</h1>
        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="high-score">最高分: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="startBtn" onclick="startGame()">开始游戏</button>
            <button id="pauseBtn" onclick="pauseGame()">暂停</button>
            <button id="restartBtn" onclick="restartGame()">重新开始</button>
        </div>
        <div class="instructions">
            <h3>游戏说明:</h3>
            <p>⌨️ 使用方向键或 WASD 控制蛇的移动</p>
            <p>🍎 吃到食物可以增长并得分</p>
            <p>⚠️ 不要撞到墙壁或自己的身体</p>
            <p>📱 在手机上可以滑动屏幕控制方向</p>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2>游戏结束!</h2>
            <p>你的得分: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // 游戏配置
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        // 游戏状态
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let gameRunning = false;
        let gamePaused = false;
        let gameSpeed = 100;

        // 触摸控制
        let touchStartX = 0;
        let touchStartY = 0;

        // 初始化游戏
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            gameSpeed = 100;
            generateFood();
            updateScore();
            highScoreElement.textContent = highScore;
        }

        // 生成食物
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格
            ctx.strokeStyle = '#111';
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // 绘制蛇
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // 蛇头
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(
                        segment.x * GRID_SIZE + 1,
                        segment.y * GRID_SIZE + 1,
                        GRID_SIZE - 2,
                        GRID_SIZE - 2
                    );
                    // 蛇眼
                    ctx.fillStyle = '#000';
                    const eyeSize = 3;
                    if (dx === 1) { // 向右
                        ctx.fillRect(segment.x * GRID_SIZE + 14, segment.y * GRID_SIZE + 6, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 14, segment.y * GRID_SIZE + 11, eyeSize, eyeSize);
                    } else if (dx === -1) { // 向左
                        ctx.fillRect(segment.x * GRID_SIZE + 3, segment.y * GRID_SIZE + 6, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 3, segment.y * GRID_SIZE + 11, eyeSize, eyeSize);
                    } else if (dy === 1) { // 向下
                        ctx.fillRect(segment.x * GRID_SIZE + 6, segment.y * GRID_SIZE + 14, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 11, segment.y * GRID_SIZE + 14, eyeSize, eyeSize);
                    } else if (dy === -1) { // 向上
                        ctx.fillRect(segment.x * GRID_SIZE + 6, segment.y * GRID_SIZE + 3, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 11, segment.y * GRID_SIZE + 3, eyeSize, eyeSize);
                    }
                } else {
                    // 蛇身
                    const gradient = ctx.createLinearGradient(
                        segment.x * GRID_SIZE,
                        segment.y * GRID_SIZE,
                        (segment.x + 1) * GRID_SIZE,
                        (segment.y + 1) * GRID_SIZE
                    );
                    gradient.addColorStop(0, '#00cc00');
                    gradient.addColorStop(1, '#009900');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(
                        segment.x * GRID_SIZE + 1,
                        segment.y * GRID_SIZE + 1,
                        GRID_SIZE - 2,
                        GRID_SIZE - 2
                    );
                }
            });

            // 绘制食物
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                2 * Math.PI
            );
            ctx.fill();
            
            // 食物高光
            ctx.fillStyle = '#ff6666';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2 - 3,
                food.y * GRID_SIZE + GRID_SIZE / 2 - 3,
                3,
                0,
                2 * Math.PI
            );
            ctx.fill();
        }

        // 更新游戏状态
        function update() {
            if (gamePaused) return;

            // 计算新的蛇头位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 检查碰撞
            if (head.x < 0 || head.x >= TILE_COUNT || 
                head.y < 0 || head.y >= TILE_COUNT ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // 添加新的蛇头
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
                // 增加速度
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            } else {
                // 移除蛇尾
                snake.pop();
            }
        }

        // 游戏步骤
        function gameStep() {
            update();
            draw();
        }

        // 更新分数
        function updateScore() {
            scoreElement.textContent = score;
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
        }

        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            initGame();
            gameRunning = true;
            gamePaused = false;
            gameOverElement.style.display = 'none';
            gameLoop = setInterval(gameStep, gameSpeed);
            document.getElementById('startBtn').textContent = '游戏中...';
        }

        // 暂停游戏
        function pauseGame() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? '继续' : '暂停';
        }

        // 重新开始游戏
        function restartGame() {
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            gameRunning = false;
            gamePaused = false;
            gameOverElement.style.display = 'none';
            document.getElementById('startBtn').textContent = '开始游戏';
            document.getElementById('pauseBtn').textContent = '暂停';
            startGame();
        }

        // 游戏结束
        function gameOver() {
            clearInterval(gameLoop);
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'flex';
            document.getElementById('startBtn').textContent = '开始游戏';
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
                case ' ':
                    pauseGame();
                    break;
            }
            e.preventDefault();
        });

        // 触摸控制
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // 水平滑动
                if (deltaX > 0 && dx === 0) {
                    dx = 1; dy = 0; // 向右
                } else if (deltaX < 0 && dx === 0) {
                    dx = -1; dy = 0; // 向左
                }
            } else {
                // 垂直滑动
                if (deltaY > 0 && dy === 0) {
                    dx = 0; dy = 1; // 向下
                } else if (deltaY < 0 && dy === 0) {
                    dx = 0; dy = -1; // 向上
                }
            }
            e.preventDefault();
        });

        // 初始化显示
        initGame();
        draw();
    </script>
</body>
</html>
