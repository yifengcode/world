<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - Five in a Row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>五子棋 Gomoku</h1>
        
        <div id="menu" class="panel">
            <h2>Game Menu</h2>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Your Name" value="Player">
            </div>
            <div class="button-group">
                <button id="createRoomBtn" class="btn btn-primary">Create Room</button>
            </div>
            <div class="divider">OR</div>
            <div class="input-group">
                <input type="text" id="roomIdInput" placeholder="Enter Room ID">
                <button id="joinRoomBtn" class="btn btn-secondary">Join Room</button>
            </div>
        </div>

        <div id="waitingRoom" class="panel" style="display: none;">
            <h2>Waiting Room</h2>
            <div id="roomInfo">
                <p>Room ID: <strong id="currentRoomId"></strong></p>
                <p>Your Color: <strong id="yourColor"></strong></p>
            </div>
            <div id="playersList"></div>
            <button id="readyBtn" class="btn btn-primary">Ready</button>
            <button id="leaveRoomBtn" class="btn btn-secondary">Leave Room</button>
        </div>

        <div id="gameArea" class="panel" style="display: none;">
            <div id="gameInfo">
                <p>Room ID: <strong id="gameRoomId"></strong></p>
                <p id="turnInfo">Current Turn: <span id="currentTurnColor"></span></p>
                <p id="gameStatus"></p>
            </div>
            <canvas id="gameBoard" width="600" height="600"></canvas>
            <div class="button-group">
                <button id="resetBtn" class="btn btn-secondary">Reset Game</button>
                <button id="exitBtn" class="btn btn-secondary">Exit Room</button>
            </div>
        </div>

        <div id="messageArea"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
